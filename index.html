<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Pro | Muti-Monitor</title>
    
    <meta name="theme-color" content="#050505">
    <link rel="manifest" href="./manifest.json">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="日期倒數6️⃣7️⃣">
    <link rel="apple-touch-icon" href="./192x192.png">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏳</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* 核心三色系統 */
            --accent-nat: #00f2ff;   /* 國定：電光青 */
            --accent-cus: #b14fff;   /* 自訂：霓虹紫 */
            --accent-make: #00ff9d;  /* 補班：矩陣綠 */
            
            --accent-danger: #ff0055;
            --bg: #050505;
            --panel: #111111;
            --panel-light: #1a1a1a;
            --text: #ffffff;
            --text-muted: #666666;
            --edge: rgba(255, 255, 255, 0.08);
            --save-glow: rgba(0, 242, 255, 0.2);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--panel);
            border: 1px solid var(--edge);
            border-radius: 32px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 頂部狀態列 */
        .top-bar {
            padding: 24px 32px 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid var(--edge);
            background: #0a0a0a;
        }

        .header h2 {
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: var(--accent-nat);
            margin: 0;
        }

        .status-sync {
            font-size: 10px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'IBM Plex Mono', monospace;
        }
        .dot { width: 6px; height: 6px; background: var(--accent-nat); border-radius: 50%; box-shadow: 0 0 10px var(--accent-nat); opacity: 0; }
        .dot.saving { animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }

        /* 分頁導航系統 */
        .tabs-wrapper {
            display: flex;
            align-items: center;
            background: #0a0a0a;
            padding: 0 16px 12px;
            border-bottom: 1px solid var(--edge);
        }

        .tabs-track {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            scroll-behavior: smooth;
            flex: 1;
            padding: 0 16px;
        }
        .tabs-track::-webkit-scrollbar { display: none; }

        .tab {
            background: var(--panel-light);
            border: 1px solid var(--edge);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 10px;
            font-family: 'IBM Plex Mono', monospace;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            user-select: none;
        }

        .tab:hover { background: #222; color: #fff; }
        .tab.active {
            background: rgba(0, 242, 255, 0.05);
            border-color: var(--accent-nat);
            color: var(--accent-nat);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.1);
        }

        .tab-actions { display: flex; gap: 4px; opacity: 0.5; }
        .tab:hover .tab-actions { opacity: 1; }
        .tab-btn { background: none; border: none; color: inherit; font-size: 10px; cursor: pointer; padding: 2px; }
        .tab-btn:hover { color: #fff; }
        .btn-del:hover { color: var(--accent-danger); }

        .btn-new-tab {
            background: transparent;
            border: 1px dashed var(--text-muted);
            color: var(--text-muted);
            width: 30px;
            height: 30px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            margin-right: 16px;
        }
        .btn-new-tab:hover { border-color: var(--text); color: var(--text); }

        /* 內容區塊 */
        .content-body { padding: 32px; }
        .control-block { margin-bottom: 24px; }
        label { display: block; font-size: 11px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; font-weight: 600; }

        input[type="date"] {
            width: 100%;
            background: var(--panel-light);
            border: 1px solid var(--edge);
            padding: 14px;
            border-radius: 14px;
            color: white;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; opacity: 0.8; }
        input[type="date"]::-webkit-calendar-picker-indicator:hover { opacity: 1; }
        input[type="date"]:focus { border-color: var(--text-muted); }

        .input-row { display: flex; gap: 8px; margin-bottom: 16px; }
        .btn-group { display: flex; gap: 6px; }
        .btn {
            background: var(--panel-light);
            border: 1px solid var(--edge);
            padding: 0 14px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
            white-space: nowrap;
        }
        .btn-nat:hover { background: var(--accent-nat); color: #000; border-color: var(--accent-nat); }
        .btn-cus:hover { background: var(--accent-cus); color: #000; border-color: var(--accent-cus); }
        .btn-make:hover { background: var(--accent-make); color: #000; border-color: var(--accent-make); }

        /* 列表網格系統：上方兩欄(減項)，下方全寬(加項) */
        .lists-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
        .list-col { background: rgba(255,255,255,0.02); border: 1px solid var(--edge); border-radius: 16px; padding: 12px; min-height: 70px; }
        .list-col-full { grid-column: 1 / -1; }
        
        .col-title { font-size: 10px; font-weight: 800; letter-spacing: 0.1em; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
        .title-nat { color: var(--accent-nat); }
        .title-cus { color: var(--accent-cus); }
        .title-make { color: var(--accent-make); }

        .tag-container { display: flex; flex-direction: column; gap: 6px; }
        .skip-tag {
            display: flex; justify-content: space-between; align-items: center;
            background: #111; padding: 6px 10px; border-radius: 8px; font-size: 11px; border-left: 2px solid;
            font-family: 'IBM Plex Mono', monospace;
        }
        .tag-nat { border-left-color: var(--accent-nat); }
        .tag-cus { border-left-color: var(--accent-cus); }
        .tag-make { border-left-color: var(--accent-make); }
        .skip-tag span { cursor: pointer; color: var(--text-muted); font-weight: bold; padding: 0 4px; }
        .skip-tag span:hover { color: #fff; }

        .display-container { margin-top: 40px; text-align: center; }
        .number-box {
            display: flex; justify-content: center; align-items: baseline; height: 100px;
            font-family: 'IBM Plex Mono', monospace; font-size: 84px; font-weight: 700; overflow: hidden;
        }
        .digit-container { display: inline-block; position: relative; }
        .push-up { animation: pushUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes pushUp {
            0% { transform: translateY(100%); opacity: 0; filter: blur(4px); }
            100% { transform: translateY(0); opacity: 1; filter: blur(0); }
        }

        .unit { font-size: 11px; color: var(--text-muted); margin-top: 10px; letter-spacing: 0.2em; font-weight: 600;}
        #totalInfo { font-size: 10px; color: var(--text-muted); margin-top: 30px; font-family: 'IBM Plex Mono', monospace; line-height: 1.6; }
        
        .stat-highlight { color: #fff; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <div class="header"><h2>倒數計時工具 | Countdown Pro</h2></div>
        <div class="status-sync">
            <div id="saveIndicator" class="dot"></div>
            <span id="saveText">SYNCED</span>
        </div>
    </div>

    <div class="tabs-wrapper">
        <div class="tabs-track" id="tabsTrack"></div>
        <button class="btn-new-tab" onclick="app.addTab()" title="New Countdown">+</button>
    </div>

    <div class="content-body" id="contentBody">
        <div class="control-block">
            <label>設定目標日期 (TARGET_DATE)</label>
            <input type="date" id="targetDate" onchange="app.updateData()">
        </div>

        <div class="control-block">
            <div style="display:flex; align-items:center; gap:12px; cursor:pointer;">
                <input type="checkbox" id="skipWeekends" onchange="app.updateData()" style="accent-color: var(--accent-nat); width:16px; height:16px; cursor:pointer;">
                <label style="margin:0; cursor:pointer;" for="skipWeekends">自動排除週末 (Exclude Weekends)</label>
            </div>
        </div>

        <div class="control-block">
            <label>管理特殊日期 (MANAGE_DATES)</label>
            <div class="input-row">
                <input type="date" id="skipDate" style="flex:1;">
                <div class="btn-group">
                    <button class="btn btn-nat" onclick="app.addDate('nat')" title="減去：國定假日">- 國定</button>
                    <button class="btn btn-cus" onclick="app.addDate('cus')" title="減去：自訂休假">- 自訂</button>
                    <button class="btn btn-make" onclick="app.addDate('make')" title="增加：補班補課">+ 補班</button>
                </div>
            </div>

            <div class="lists-grid">
                <div class="list-col">
                    <div class="col-title title-nat">國定假日</div>
                    <div id="natList" class="tag-container"></div>
                </div>
                <div class="list-col">
                    <div class="col-title title-cus">自訂假日</div>
                    <div id="cusList" class="tag-container"></div>
                </div>
                <div class="list-col list-col-full">
                    <div class="col-title title-make">補班補課</div>
                    <div id="makeList" class="tag-container" style="flex-direction: row; flex-wrap: wrap;"></div>
                </div>
            </div>
        </div>

        <div class="display-container">
            <div class="number-box" id="remainingDays"></div>
            <div class="unit" id="tabDisplayName">TASK_NAME REMAINING</div>
            <div id="totalInfo">INITIALIZING...</div>
        </div>
    </div>
</div>

<script>
    const app = {
        state: {
            activeId: null,
            tabs: []
        },
        currentNumberStr: "",

        createDefaultTab: function(name = "PROJECT_ALPHA") {
            return {
                id: 'tab_' + Date.now().toString(36) + Math.random().toString(36).substr(2, 5),
                name: name,
                targetDate: "",
                skipWeekends: true,
                natSkips: [],
                cusSkips: [],
                makeUpDays: [] 
            };
        },

        init: function() {
            // 升級資料庫至 v6，強制清除舊版的 2026/06/30 快取
            const saved = localStorage.getItem('chronos_system_v6');
            if (saved) {
                this.state = JSON.parse(saved);
                if (!this.state.tabs || this.state.tabs.length === 0) {
                    const dt = this.createDefaultTab("新分頁");
                    this.state.tabs = [dt];
                    this.state.activeId = dt.id;
                } else {
                    this.state.tabs.forEach(t => {
                        if(!t.makeUpDays) t.makeUpDays = [];
                    });
                }
            } else {
                const dt = this.createDefaultTab("新分頁");
                this.state.tabs = [dt];
                this.state.activeId = dt.id;
            }
            this.renderTabs();
            this.loadActiveTabToDOM();
        },

        save: function() {
            localStorage.setItem('chronos_system_v6', JSON.stringify(this.state));
            const ind = document.getElementById('saveIndicator');
            const txt = document.getElementById('saveText');
            ind.classList.add('saving');
            txt.innerText = "SAVING...";
            setTimeout(() => {
                ind.classList.remove('saving');
                txt.innerText = "SYNCED";
            }, 800);
        },

        getActiveTab: function() {
            return this.state.tabs.find(t => t.id === this.state.activeId);
        },

        renderTabs: function() {
            const track = document.getElementById('tabsTrack');
            track.innerHTML = this.state.tabs.map(tab => `
                <div class="tab ${tab.id === this.state.activeId ? 'active' : ''}" onclick="app.switchTab('${tab.id}')">
                    <span>${tab.name}</span>
                    <div class="tab-actions">
                        <button class="tab-btn" title="Rename" onclick="app.renameTab(event, '${tab.id}')">✎</button>
                        <button class="tab-btn btn-del" title="Delete" onclick="app.deleteTab(event, '${tab.id}')">×</button>
                    </div>
                </div>
            `).join('');
            
            const activeEl = track.querySelector('.active');
            if(activeEl) activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        },

        switchTab: function(id) {
            if (this.state.activeId === id) return;
            this.state.activeId = id;
            this.currentNumberStr = ""; 
            this.save();
            this.renderTabs();
            this.loadActiveTabToDOM();
        },

        addTab: function() {
            const name = prompt("Enter new countdown identifier:", "NEW_TASK");
            if (!name) return;
            const newTab = this.createDefaultTab(name.trim().toUpperCase().replace(/\s+/g, '_'));
            this.state.tabs.push(newTab);
            this.switchTab(newTab.id);
        },

        renameTab: function(e, id) {
            e.stopPropagation(); 
            const tab = this.state.tabs.find(t => t.id === id);
            const newName = prompt("Rename identifier:", tab.name);
            if (newName && newName.trim() !== "") {
                tab.name = newName.trim().toUpperCase().replace(/\s+/g, '_');
                this.save();
                this.renderTabs();
                if (this.state.activeId === id) {
                    document.getElementById('tabDisplayName').innerText = `${tab.name} REMAINING`;
                }
            }
        },

        deleteTab: function(e, id) {
            e.stopPropagation();
            if(!confirm("Destroy this countdown data?")) return;

            this.state.tabs = this.state.tabs.filter(t => t.id !== id);
            
            if (this.state.tabs.length === 0) {
                const dt = this.createDefaultTab("SYSTEM_REBOOT");
                this.state.tabs.push(dt);
                this.state.activeId = dt.id;
            } else if (this.state.activeId === id) {
                this.state.activeId = this.state.tabs[this.state.tabs.length - 1].id;
            }
            
            this.currentNumberStr = "";
            this.save();
            this.renderTabs();
            this.loadActiveTabToDOM();
        },

        loadActiveTabToDOM: function() {
            const tab = this.getActiveTab();
            document.getElementById('targetDate').value = tab.targetDate;
            document.getElementById('skipWeekends').checked = tab.skipWeekends;
            document.getElementById('tabDisplayName').innerText = `${tab.name} REMAINING`;
            this.renderLists();
            this.calculate();
        },

        updateData: function() {
            const tab = this.getActiveTab();
            tab.targetDate = document.getElementById('targetDate').value;
            tab.skipWeekends = document.getElementById('skipWeekends').checked;
            this.calculate();
            this.save();
        },

        addDate: function(type) {
            const val = document.getElementById('skipDate').value;
            if (!val) return;
            const tab = this.getActiveTab();

            tab.natSkips = tab.natSkips.filter(d => d !== val);
            tab.cusSkips = tab.cusSkips.filter(d => d !== val);
            tab.makeUpDays = tab.makeUpDays.filter(d => d !== val);

            if (type === 'nat') tab.natSkips.push(val);
            if (type === 'cus') tab.cusSkips.push(val);
            if (type === 'make') tab.makeUpDays.push(val);
            
            this.renderLists();
            this.updateData();
        },

        removeDate: function(type, val) {
            const tab = this.getActiveTab();
            if (type === 'nat') tab.natSkips = tab.natSkips.filter(d => d !== val);
            if (type === 'cus') tab.cusSkips = tab.cusSkips.filter(d => d !== val);
            if (type === 'make') tab.makeUpDays = tab.makeUpDays.filter(d => d !== val);
            
            this.renderLists();
            this.updateData();
        },

        renderLists: function() {
            const tab = this.getActiveTab();
            const natContainer = document.getElementById('natList');
            const cusContainer = document.getElementById('cusList');
            const makeContainer = document.getElementById('makeList');

            natContainer.innerHTML = [...tab.natSkips].sort().map(d => `
                <div class="skip-tag tag-nat">${d} <span onclick="app.removeDate('nat', '${d}')">×</span></div>
            `).join('');

            cusContainer.innerHTML = [...tab.cusSkips].sort().map(d => `
                <div class="skip-tag tag-cus">${d} <span onclick="app.removeDate('cus', '${d}')">×</span></div>
            `).join('');

            makeContainer.innerHTML = [...tab.makeUpDays].sort().map(d => `
                <div class="skip-tag tag-make">${d} <span onclick="app.removeDate('make', '${d}')">×</span></div>
            `).join('');
        },

        calculate: function() {
            const tab = this.getActiveTab();
            const info = document.getElementById('totalInfo');

            if (!tab.targetDate) {
                this.updateAnimatedDisplay("-");
                info.innerText = "STATUS: AWAITING_TARGET_DATE";
                return;
            }

            const targetDate = new Date(tab.targetDate);
            targetDate.setHours(0,0,0,0);
            const today = new Date();
            today.setHours(0,0,0,0);

            if (isNaN(targetDate.getTime()) || targetDate <= today) {
                this.updateAnimatedDisplay("0");
                info.innerText = "ERROR: TARGET_DATE_PASSED_OR_INVALID";
                return;
            }

            let workDays = 0, wkndCount = 0, natCount = 0, cusCount = 0, makeCount = 0, total = 0;
            let curr = new Date(today);
            const fmt = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            
            const natSet = new Set(tab.natSkips);
            const cusSet = new Set(tab.cusSkips);
            const makeSet = new Set(tab.makeUpDays);

            while (curr < targetDate) {
                total++;
                const day = curr.getDay();
                const dateStr = fmt(curr);
                const isWeekend = (day === 0 || day === 6);

                if (makeSet.has(dateStr)) {
                    workDays++;
                    makeCount++;
                } 
                else if (natSet.has(dateStr)) {
                    natCount++;
                } 
                else if (cusSet.has(dateStr)) {
                    cusCount++;
                } 
                else if (tab.skipWeekends && isWeekend) {
                    wkndCount++;
                } 
                else {
                    workDays++;
                }
                
                curr.setDate(curr.getDate() + 1);
            }

            this.updateAnimatedDisplay(workDays.toString());
            
            info.innerHTML = `
                GROSS_DAYS: <span class="stat-highlight">${total}</span> | 
                WKND: -${wkndCount} <br>
                NAT: -${natCount} | 
                CUS: -${cusCount} | 
                MAKE: +${makeCount}
            `;
        },

        updateAnimatedDisplay: function(newNumber) {
            const displayBox = document.getElementById('remainingDays');
            const oldArr = this.currentNumberStr.split('').reverse();
            const newArr = newNumber.split('').reverse();
            const maxLen = Math.max(oldArr.length, newArr.length);
            
            displayBox.innerHTML = "";
            for (let i = maxLen - 1; i >= 0; i--) {
                const oldDigit = oldArr[i] || "";
                const newDigit = newArr[i] || "";
                const span = document.createElement('span');
                span.className = 'digit-container';
                span.innerText = newDigit;
                if (newDigit !== oldDigit) span.classList.add('push-up');
                displayBox.appendChild(span);
            }
            this.currentNumberStr = newNumber;
        }
    };

    window.onload = () => {
        app.init();
    };
</script>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('Chronos Nexus: Core SW registered.'))
                .catch(err => console.error('Chronos Nexus: SW boot failed.', err));
        });
    }
</script>

</body>
</html>
